name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI is set on GitHub runners, so check.mjs lints without --fix and fails on any error.
      - run: npm run check
      # Builds the app and runs it against the local mock API. No key, no real API calls.
      - run: npm run smoke
